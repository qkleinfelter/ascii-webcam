<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII Webcam</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ASCII Webcam</h1>
    <p class="subtitle">Live camera feed rendered as text art</p>
  </header>

  <main>
    <div class="controls">
      <button id="startBtn">Start Camera</button>
      <button id="stopBtn" disabled>Stop Camera</button>
      <button id="flipBtn" disabled>Flip Camera</button>
      <button id="captureBtn" disabled>Capture Polaroid</button>

      <label class="control">
        Resolution
        <input type="range" id="resSlider" min="40" max="160" value="100" step="4">
        <span id="resValue">100</span>
      </label>

      <label class="control">
        Color
        <input type="checkbox" id="colorToggle">
      </label>

      <label class="control">
        Invert
        <input type="checkbox" id="invertToggle">
      </label>

      <label class="control">
        Characters (dark&rarr;light)
        <input type="text" id="charsetInput" maxlength="32" spellcheck="false" autocomplete="off">
      </label>
      <button id="charsetResetBtn" type="button">Reset Characters</button>
    </div>

    <div id="status" class="status"></div>

    <div class="monitor">
      <div class="monitor-bezel">
        <div class="stage">
          <pre id="ascii-output" aria-label="ASCII rendering of webcam feed"></pre>
          <div class="scanlines"></div>
          <div class="crt-glow"></div>
        </div>
        <div class="monitor-label">MODEL 1455 &mdash; MONO/COLOR DISPLAY</div>
      </div>
      <div class="monitor-neck"></div>
      <div class="monitor-base"></div>
    </div>

    <section class="pinboard">
      <h2 class="pinboard-title">Snapshots</h2>
      <div id="polaroidBoard" class="pinboard-surface">
        <p class="pinboard-empty" id="pinboardEmpty">Captured polaroids will appear here.</p>
      </div>
    </section>
  </main>

  <video id="video" playsinline autoplay muted style="display:none;"></video>
  <canvas id="canvas" style="display:none;"></canvas>

  <script src="script.js"></script>
</body>
</html>
